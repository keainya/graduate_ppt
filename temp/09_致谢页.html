<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<title>致谢页 - 毕业答辩PPT模板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 720px; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    background: linear-gradient(135deg, #0a1628 0%, #0d2137 30%, #0a2647 60%, #0d1b2a 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative; color: #fff; text-align: center;
  }

  /* 装饰元素 */
  .deco-circle-1 {
    position: absolute; width: 500px; height: 500px;
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 50%; top: -200px; right: -150px;
  }
  .deco-circle-2 {
    position: absolute; width: 350px; height: 350px;
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 50%; bottom: -100px; left: -100px;
  }
  .deco-dots {
    position: absolute; top: 80px; right: 120px;
    display: grid; grid-template-columns: repeat(6, 6px);
    gap: 12px;
  }
  .deco-dot {
    width: 3px; height: 3px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }

  /* 主标题 */
  .thanks-main {
    font-size: 64px; font-weight: 300;
    letter-spacing: 16px;
    color: rgba(255,255,255,0.9);
    margin-bottom: 10px;
    position: relative; z-index: 2;
  }
  .thanks-en {
    font-size: 16px; letter-spacing: 8px;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    margin-bottom: 40px;
    position: relative; z-index: 2;
  }

  /* 分隔线 */
  .divider-line {
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    margin-bottom: 40px;
  }

  /* 感谢语 */
  .thanks-text {
    font-size: 18px; color: rgba(255,255,255,0.55);
    letter-spacing: 4px; line-height: 2.2;
    position: relative; z-index: 2;
  }
  .thanks-text strong {
    color: rgba(255,255,255,0.8);
    font-weight: 400;
  }

  /* 底部信息 */
  .footer-info {
    position: absolute; bottom: 60px;
    display: flex; gap: 40px; z-index: 2;
  }
  .footer-item {
    display: flex; flex-direction: column;
    gap: 4px; align-items: center;
  }
  .footer-item .fi-label {
    font-size: 11px; color: rgba(255,255,255,0.25);
    letter-spacing: 3px;
  }
  .footer-item .fi-value {
    font-size: 14px; color: rgba(255,255,255,0.5);
    letter-spacing: 2px;
  }

  /* USTC标识 */
  .ustc-footer {
    position: absolute; bottom: 55px; left: 80px;
    display: flex; align-items: center; gap: 10px;
    z-index: 2;
  }
  .ustc-footer .ustc-mark {
    width: 30px; height: 30px;
    background: linear-gradient(135deg, #1a5276, #003d7a);
    border-radius: 6px; display: flex;
    align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
    color: #fff; border: 1px solid rgba(255,255,255,0.2);
  }
  .ustc-footer .ustc-name {
    font-size: 12px; color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
  }

  /* 顶部渐变线 */
  .top-gradient {
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: linear-gradient(90deg, #003d7a, #5dade2, transparent);
  }
</style>
</head>
<body>
  <div class="top-gradient"></div>
  <div class="deco-circle-1"></div>
  <div class="deco-circle-2"></div>
  <div class="deco-dots" id="dotGrid"></div>

  <h1 class="thanks-main">致 谢</h1>
  <p class="thanks-en">Acknowledgements</p>

  <div class="divider-line"></div>

  <p class="thanks-text">
    感谢各位评审老师在百忙之中审阅本文<br>
    感谢导师的悉心指导与耐心帮助<br>
    感谢实验室各位同学的协作与支持<br>
    感谢家人与朋友的理解与鼓励
  </p>

  <div class="ustc-footer">
    <div class="ustc-mark">USTC</div>
    <span class="ustc-name">中国科学技术大学</span>
  </div>

  <div class="footer-info" style="right:80px;left:auto;">
    <div class="footer-item">
      <span class="fi-label">答辩人</span>
      <span class="fi-value">谢博谦</span>
    </div>
    <div class="footer-item">
      <span class="fi-label">专 业</span>
      <span class="fi-value">软件工程</span>
    </div>
    <div class="footer-item">
      <span class="fi-label">日 期</span>
      <span class="fi-value">2026.05</span>
    </div>
  </div>

  <script>
    const grid = document.getElementById('dotGrid');
    for (let i = 0; i < 36; i++) {
      const d = document.createElement('div');
      d.className = 'deco-dot';
      d.style.opacity = 0.03 + Math.random() * 0.1;
      grid.appendChild(d);
    }
  </script>
</body>
</html>
