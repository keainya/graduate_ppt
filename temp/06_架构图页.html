<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=720">
<title>架构图页 - 毕业答辩PPT模板</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 720px; overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
    background: #f7f8fc;
    display: flex; flex-direction: column;
  }

  .header {
    height: 80px; background: #fff;
    display: flex; align-items: center;
    padding: 0 60px;
    border-bottom: 1px solid #e2e6ed;
  }
  .header .tag {
    font-size: 13px; color: #003d7a;
    font-weight: 600; letter-spacing: 3px;
  }
  .header .title {
    font-size: 22px; color: #1a1a2e;
    font-weight: 600; margin-left: 20px; letter-spacing: 2px;
    padding-left: 20px; border-left: 1px solid #dde;
  }

  /* 架构图容器 */
  .arch-container {
    flex: 1; padding: 30px 60px;
    display: flex; flex-direction: column;
    gap: 20px; justify-content: center;
  }

  /* 架构层 */
  .arch-layer {
    background: #fff; border-radius: 12px;
    border: 1px solid #e8ecf1;
    padding: 22px 28px;
    display: flex; align-items: center;
    gap: 20px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.03);
    position: relative;
  }
  .arch-layer .layer-tag {
    font-size: 11px; font-weight: 700;
    color: #fff; background: #003d7a;
    padding: 4px 14px; border-radius: 4px;
    letter-spacing: 2px; white-space: nowrap;
    min-width: 70px; text-align: center;
  }
  .arch-layer .layer-name {
    font-size: 15px; font-weight: 600;
    color: #1a1a2e; min-width: 90px;
    letter-spacing: 1px;
  }
  .arch-layer .layer-desc {
    font-size: 13px; color: #888;
    min-width: 80px;
  }

  /* 模块 boxes */
  .arch-modules {
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  .module-box {
    background: linear-gradient(135deg, #eef3f9 0%, #e3eaf2 100%);
    border: 1px solid #d4dde8; border-radius: 8px;
    padding: 10px 16px; font-size: 13px;
    color: #2c3e50; font-weight: 500;
    white-space: nowrap; letter-spacing: 1px;
    transition: all 0.2s;
  }
  .module-box.highlight {
    background: linear-gradient(135deg, #003d7a 0%, #0056a6 100%);
    color: #fff; border-color: #003d7a;
  }
  .module-box.accent {
    background: linear-gradient(135deg, #e8f4fd 0%, #d1ecf9 100%);
    border-color: #5dade2;
  }

  /* 层间箭头 */
  .arrow-down {
    display: flex; justify-content: center;
    color: #003d7a; font-size: 20px;
    font-weight: 300; letter-spacing: 4px;
    opacity: 0.5;
  }

  /* 左侧连接线 */
  .connector-label {
    position: absolute; left: -50px;
    font-size: 10px; color: #aaa;
    writing-mode: vertical-rl;
    letter-spacing: 2px;
    top: 50%; transform: translateY(-50%);
  }

  .page-num {
    position: absolute; bottom: 20px; right: 60px;
    font-size: 13px; color: #bbb;
  }
</style>
</head>
<body>
  <div class="header">
    <span class="tag">系统架构</span>
    <span class="title">三层解耦架构总览</span>
  </div>

  <div class="arch-container">
    <!-- API接入层 -->
    <div class="arch-layer" style="margin-top:0;">
      <span class="layer-tag">L1</span>
      <span class="layer-name">API接入层</span>
      <span class="layer-desc">入口网关</span>
      <div class="arch-modules">
        <div class="module-box highlight">权限鉴定</div>
        <div class="module-box highlight">数据校验</div>
        <div class="module-box">API路由</div>
        <div class="module-box">参数画像</div>
        <div class="module-box accent">异构数据映射</div>
      </div>
    </div>

    <div class="arrow-down">↓ ↓ ↓</div>

    <!-- 任务调度层 -->
    <div class="arch-layer">
      <span class="layer-tag">L2</span>
      <span class="layer-name">任务调度层</span>
      <span class="layer-desc">调度核心</span>
      <div class="arch-modules">
        <div class="module-box highlight">任务可用性检测</div>
        <div class="module-box highlight">资源互斥分析</div>
        <div class="module-box">负载均衡</div>
        <div class="module-box">数据同步</div>
        <div class="module-box accent">容错恢复</div>
        <div class="module-box accent">自动化决策引擎</div>
      </div>
    </div>

    <div class="arrow-down">↓ ↓ ↓</div>

    <!-- 任务执行层 -->
    <div class="arch-layer">
      <span class="layer-tag">L3</span>
      <span class="layer-name">任务执行层</span>
      <span class="layer-desc">执行载体</span>
      <div class="arch-modules">
        <div class="module-box highlight">参数传递</div>
        <div class="module-box">任务编排</div>
        <div class="module-box">异常捕获</div>
        <div class="module-box accent">并发执行</div>
      </div>
    </div>

    <div class="arrow-down">↓ ↓ ↓</div>

    <!-- 基础设施层 -->
    <div class="arch-layer">
      <span class="layer-tag" style="background:#555;">INFRA</span>
      <span class="layer-name">基础设施层</span>
      <span class="layer-desc">支撑平台</span>
      <div class="arch-modules">
        <div class="module-box" style="background:#f0f0f0;border-color:#ccc;">Celery</div>
        <div class="module-box" style="background:#f0f0f0;border-color:#ccc;">Redis</div>
        <div class="module-box" style="background:#f0f0f0;border-color:#ccc;">PostgreSQL</div>
        <div class="module-box" style="background:#f0f0f0;border-color:#ccc;">Docker/K8s</div>
        <div class="module-box" style="background:#f0f0f0;border-color:#ccc;">FastAPI</div>
      </div>
    </div>
  </div>

  <div class="page-num">12</div>
</body>
</html>
